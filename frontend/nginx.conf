server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA-only. On Render the browser calls the API via VITE_API_URL (absolute).
  # Compose overrides this file with nginx.compose.conf for same-origin /api proxy.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
